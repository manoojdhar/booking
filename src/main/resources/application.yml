spring:
  application:
    name: demo-booking
  devtools:
    auto-reload: true
  datasource:
    url: jdbc:postgresql://localhost:5432/booking
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        create-drop: true
        hbm2ddl:
          auto: update

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
    org.springframework.boot.devtools: DEBUG 
# Uncomment to enable H2 console
#spring:
#  h2:
#    console:
#      enabled: true
#      path: /h2-console

java:
  toolchain:
    language-version: 21
  auto-build: true
  auto-reload:
    enabled: true

server:
  port: 8000
